<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
   
</head>
<body class="bg-primary d-flex align-items-center min-vh-100">
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                <div class="card bg-white shadow">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="card-title mb-4 font-weight-bolder">Sign Up</h1>
                        <p class="text-muted">Please fill in this form to create an account!</p>
                        <form method="post">
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <input
                                        type="text"
                                        class="form-control bg-light border-0"
                                        id="firstName"
                                        name="firstName"
                                        placeholder="First name"
                                        autocomplete="given-name"
                                        required
                                    >
                                </div>
                                <div class="form-group col-md-6">
                                    <input
                                        type="text"
                                        class="form-control bg-light border-0 "
                                        id="lastName"
                                        name="lastName"
                                        placeholder="Last name"
                                        autocomplete="family-name"
                                        required
                                    >
                                </div>
                            </div>
                            <div class="form-group">
                                <input
                                    type="email"
                                    class="form-control bg-light border-0"
                                    id="email"
                                    name="email"
                                    placeholder="name@example.com"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <input
                                    type="password"
                                    class="form-control bg-light border-0"
                                    id="password"
                                    name="password"
                                    placeholder="Password"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <input
                                    type="password"
                                    class="form-control border-0 bg-light"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Confirm Password"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>
                            <div class="form-group">
                                <div class="custom-control custom-checkbox">
                                    <input
                                        type="checkbox"
                                        class="custom-control-input"
                                        id="terms"
                                        name="terms"
                                        required
                                    >
                                    <label
                                        class="custom-control-label text-muted"
                                        for="terms"
                                    >
                                        I accept the  <a href="#">terms of use</a> and <a href="#">privacy policy</a>
                                    </label>
                                </div>
                            </div>
                            <button
                                type="submit"
                                class="btn btn-primary w-25 font-weight-bolder"
                            >
                                Sign up
                            </button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-white mt-3 mb-0">
                    Already have an account?
                    <u><a
                        href="#loginModal"
                        class="text-white font-weight-bold "
                        data-toggle="modal"
                        role="button"

                    >
                        Login here
                    </a></u>
                </p>
            </div>
        </div>
    </main>
    <div
        class="modal fade"
        id="loginModal"
        tabindex="-1"
        role="dialog"
        aria-labelledby="loginModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="loginModalLabel">Log in</h2>
                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                    >
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form method="post">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                name="email"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="loginPassword"
                                name="password"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            Log in
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
