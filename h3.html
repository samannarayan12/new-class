<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Progress Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row">
            <div class="col-12 col-lg-8 mx-auto">
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item"><a href="#">Courses</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Web Development</li>
                    </ol>
                </nav>

                <section class="bg-white border rounded shadow-sm p-4">
                    <h1 class="h2 text-center mb-4">
                        Web Development Course <span class="badge bg-primary">New</span>
                    </h1>

                    <p class="mb-1">HTML <span>100%</span></p>
                    <div class="progress mb-3" role="progressbar">
                        <div class="progress-bar progress-bar-striped bg-success" style="width: 100%">100%</div>
                    </div>

                    <p class="mb-1">CSS <span class="text-secondary">75%</span></p>
                    <div class="progress mb-3" role="progressbar">
                        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 75%">75%</div>
                    </div>

                    <p class="mb-1">JavaScript <span class="text-secondary">50%</span></p>
                    <div class="progress mb-3" role="progressbar" aria-label="JavaScript progress" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-warning text-dark" style="width: 50%">50%</div>
                    </div>

                    <p class="mb-1">Bootstrap <span class="text-secondary">25%</span></p>
                    <div class="progress mb-4" role="progressbar" aria-label="Bootstrap progress" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar bg-danger" style="width: 25%">25%</div>
                    </div>

                    <div class="text-center mb-4">
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-success">Start</button>
                            <button type="button" class="btn btn-warning">Pause</button>
                            <button type="button" class="btn btn-outline-secondary">Reset</button>
                        </div>
                    </div>

                    <nav aria-label="Course pages">
                        <ul class="pagination justify-content-center mb-0">
                            <li class="page-item active" aria-current="page"><span class="page-link">1</span></li>
                            <li class="page-item"><a class="page-link" href="#page-2">2</a></li>
                            <li class="page-item disabled"><span class="page-link">3</span></li>
                        </ul>
                    </nav>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
