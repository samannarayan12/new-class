<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Deals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="banners" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200" class="d-block w-100 object-fit-cover" height="820" alt="Beach">
                <div class="carousel-caption">
                    <h2>Relax by the sea</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#details">Book Now</button>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200" class="d-block w-100 object-fit-cover" height="820" alt="Mountains">
                <div class="carousel-caption">
                    <h2>Explore the mountains</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#details">Book Now</button>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1200" class="d-block w-100 object-fit-cover" height="820" alt="City">
                <div class="carousel-caption">
                    <h2>Discover a new city</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#details">Book Now</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="details" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <h2>Travel details</h2>
                <p>Contact us to learn about our travel packages.</p>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
