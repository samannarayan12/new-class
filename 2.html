<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <h1 class="display-5 text-center mb-3">Student Profile</h1>

        <blockquote class="blockquote text-center mb-4">
            <p>“Learning never exhausts the mind.”</p>
        </blockquote>

        <div class="text-center mb-4">
            <img
                src="https://static.vecteezy.com/system/resources/previews/043/117/299/non_2x/illustration-of-boy-profile-anime-style-black-silhouette-isolated-on-white-background-free-vector.jpg
                class="rounded-circle"
                alt="Student profile"
                width="160"
                height="160"
                style="object-fit: cover;"
            >
        </div>

        <div class="table-responsive">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Mathematics</td>
                        <td>92</td>
                    </tr>
                    <tr>
                        <td>Science</td>
                        <td>88</td>
                    </tr>
                    <tr>
                        <td>English</td>
                        <td>95</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-success alert-dismissible fade show">
            <button type="button" class="close" 
            data-dismiss="alert">*</button>
            Profile updated successfully!
        </div>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
