<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Destinations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="travel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200"
                    class="d-block w-100"
                    height="770"
                    alt="Tropical beach">
                <div class="carousel-caption">
                    <h2>Relax on a tropical beach</h2>
                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#booking">Book Now</button>
                </div>
            </div>
            <div class="carousel-item">
                <img
                    src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200"
                    class="d-block w-100"
                    height="770"
                    alt="Mountain destination">
                <div class="carousel-caption">
                    <h2>Explore the mountains</h2>
                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#booking">Book Now</button>
                </div>
            </div>
            <div class="carousel-item">
                <img
                    src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=1200"
                    class="d-block w-100"
                    height="770"
                    alt="City destination">
                <div class="carousel-caption">
                    <h2>Discover a vibrant city</h2>
                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#booking">Book Now</button>
                </div>
            </div>
        </div>
    </div>

    <div
        class="modal fade"
        id="booking"
        tabindex="-1"
        aria-labelledby="bookingTitle"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="bookingTitle">Booking Details</h2>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Choose your destination and contact our travel team to plan your trip.
                </div>
            </div>
        </div>
    </div>

    <p class="text-center mt-3">
        <span title="Click Book Now to view booking details." aria-label="Booking information">ⓘ</span>
        Hover over the info icon for booking help.
    </p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
